# Builds the app for macOS and Windows. Run it by hand (Actions tab > Build app > Run workflow) or push a tag
# like v0.2.0, which also attaches the zips to a GitHub release.
#
# NOTE: written without being able to run it. If the first run fails, the logs will say where; the build
# itself (tools/build_app.py) is tested on macOS.
name: Build app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]   # macos-latest is Apple Silicon: the app will not run on Intel Macs
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,build]"
      - name: Test
        run: python -m pytest -q -m "not slow"
      - name: Build
        run: python tools/build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: GridironScramble-${{ matrix.os }}
          path: dist/GridironScramble-*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GridironScramble-*.zip

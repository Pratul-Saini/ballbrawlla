[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ballbrawlla"
version = "0.1.0"
description = "Ball-throwing platformer prototype"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ballbrawlla = "ballbrawlla.main:run"
ballbrawlla-relay = "ballbrawlla.net.relay_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: brute-force physics sweeps (about 9 s each). Skip with: pytest -m \"not slow\"",
]
